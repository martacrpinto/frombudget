name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests when present
        shell: bash
        run: |
          if pnpm pkg get scripts.test | grep -qv 'null'; then
            pnpm test
          else
            echo 'No test script configured; skipping.'
          fi

      - name: Build Vite frontend
        run: pnpm build

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reject tracked secrets and database files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|.*\.db(-journal)?$|.*\.sqlite(-journal)?$|service-account.*\.json$|.*\.pem$|.*\.key$)'
          if git ls-files -z | tr '\0' '\n' | grep -Eiq "$forbidden"; then
            echo 'Forbidden secret or database file is tracked.' >&2
            git ls-files | grep -Ei "$forbidden" >&2 || true
            exit 1
          fi
          echo 'No tracked secret/database files detected.'
